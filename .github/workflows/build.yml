name: Build APK

# 触发条件：推送到 main/master 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libgl1-mesa-dev libgles2-mesa-dev xorg-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer
          # 固定 Cython < 3，避免与 kivy 构建不兼容
          pip install "cython<3.0"

      - name: Build APK
        run: |
          # 兼容两种仓库结构：android_app 子目录 或 直接放根目录
          if [ -d android_app ]; then cd android_app; fi
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ans-helper-apk
          path: |
            android_app/bin/*.apk
            bin/*.apk
